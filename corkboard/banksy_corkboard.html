<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNWARRANTED INFLUENCE — The Evidence Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;700;900&family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@700;900&family=Lora:ital,wght@0,400;0,600&family=Kalam:wght@300;400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./corkboard.css">
<script src="./corkboard-helpers.js" defer></script>
<style>
:root {
  /* BANKSY PALETTE - Street Art / Subversive */
  --banksy-brick: #8b3a3a;
  --banksy-concrete: #3a3a3a;
  --banksy-moss: #4a5d4a;
  --banksy-yellow: #c9a227;
  --spray-white: #f0f0f0;
  --spray-black: #1a1a1a;
  --spray-red: #cc0000;

  /* SHEPARD FAIREY / OBEY PALETTE - Propaganda */
  --obey-red: #d71920;
  --obey-red-dark: #8b0000;
  --obey-cream: #f4e9d5;
  --obey-black: #0a0a0a;
  --obey-gray: #2a2a2a;
  --obey-blue: #4a6fa5;

  /* EPSTEIN FILES PALETTE - Redacted Documents */
  --redaction-bar: #0a0a0a;
  --paper-fbi: #c4b89a;
  --paper-aged: #d4cfc4;
  --stamp-red: #b91c1c;
  --ink-typewriter: #2a2a2a;

  /* GONZO HUNTER S PALETTE */
  --typewriter-white: #f5f5f0;
  --cigarette-ash: #8a8a8a;
  --bourbon-amber: #b8860b;

  /* Strings */
  --string-red: #ff1a1a;
  --string-glow: rgba(255, 50, 50, 0.8);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--obey-black);
  font-family: "Special Elite", monospace;
  color: var(--obey-cream);
}

/* ======================= WALL - STREET ART COLLAGE ======================= */
#stage {
  position: fixed;
  inset: 0;
  background:
    /* Torn poster layers */
    repeating-linear-gradient(90deg, transparent 0 2px, rgba(0,0,0,0.03) 2px 4px),
    /* Spray paint scratches */
    radial-gradient(ellipse at 20% 30%, rgba(215,25,32,0.12), transparent 40%),
    radial-gradient(ellipse at 80% 70%, rgba(200,180,160,0.08), transparent 50%),
    /* Concrete base with grunge */
    linear-gradient(135deg, #1a1510 0%, #0d0a06 50%, #1a1210 100%);
  cursor: grab;
  user-select: none;
}

/* NOTE: inline styles preserved to avoid accidental visual regression. A shared stylesheet (/corkboard/corkboard.css) has been added to centralize and normalize variables and responsive behavior. */
</style>
</head>
<body>

<div id="stage">
  <div id="world">
    <div class="collage-layer" id="collage"></div>
    <svg id="edges"></svg>
  </div>
</div>

<!-- Rest of the original file unchanged to preserve behavior -->

</body>
</html>
