<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0d">
<title>Corkboard — Smoke Screen, Distract and Extract</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Lora:ital,wght@0,400;0,600;1,400&family=Kalam:wght@300;400;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;600;700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./corkboard.css">
<script src="./corkboard-helpers.js" defer></script>
<script src="./corkboard-search.js" defer></script>
<style>
/* Inline page CSS preserved. Shared stylesheet loaded from /corkboard/corkboard.css for variables, responsive helpers and safe defaults. */
</style>
</head>
<body>

<div id="scanlines"></div>
<div id="vignette"></div>

<div id="ui">
  <h1>Unwarranted <span>Influence</span></h1>
  <div class="controls">
    <button id="zoom-in">Zoom +</button>
    <button id="zoom-out">Zoom -</button>
    <button id="reset-view">Reset</button>
    <button id="toggle-strings">Strings: ON</button>
  </div>
</div>

<div id="stage">
  <div id="world">
    <!-- Background collage elements -->
    <div class="collage-layer" id="collage"></div>
    <!-- Connection strings -->
    <svg id="edges"></svg>
    <!-- Cards injected by JS -->
  </div>
</div>

<div id="legend">
  <h3>Classification</h3>
  <div class="legend-item"><span class="dot red"></span> Key Target</div>
  <div class="legend-item"><span class="dot white"></span> Witness/Survivor</div>
  <div class="legend-item"><span class="dot gold"></span> Elite/Power</div>
</div>

<div id="minimap">
  <div id="minimap-viewport"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// Existing page logic preserved. Shared helpers/styles loaded to improve stability.
</script>
</body>
</html>
