<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNWARRANTED INFLUENCE — The Conspiracy Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;700;900&family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@700;900&family=Lora:ital,wght@0,400;0,600&family=Kalam:wght@300;400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/corkboard/corkboard.css">
<script src="/corkboard/corkboard-helpers.js" defer></script>
<style>
/* Inline styles preserved for compatibility; shared styles are loaded from /corkboard/corkboard.css */
</style>
</head>
<body>

<div id="scanlines"></div>
<div id="vignette"></div>

<div id="ui">
  <h1>Unwarranted <span>Influence</span></h1>
  <div class="controls">
    <button id="zoom-in">Zoom +</button>
    <button id="zoom-out">Zoom -</button>
    <button id="reset-view">Reset</button>
    <button id="toggle-strings">Strings: ON</button>
  </div>
</div>

<div id="stage">
  <div id="world">
    <!-- Background collage elements -->
    <div class="collage-layer" id="collage"></div>
    <!-- Connection strings -->
    <svg id="edges"></svg>
    <!-- Cards injected by JS -->
  </div>
</div>

<div id="legend">
  <h3>Classification</h3>
  <div class="legend-item"><span class="dot red"></span> Key Target</div>
  <div class="legend-item"><span class="dot white"></span> Witness/Survivor</div>
  <div class="legend-item"><span class="dot gold"></span> Elite/Power</div>
</div>

<div id="minimap">
  <div id="minimap-viewport"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// Existing page scripts remain intact; helper and shared CSS loaded to improve resilience and responsiveness.
</script>
</body>
</html>
